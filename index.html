<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lektion 1: Vetenskapsdetektiven – Naturkunskap 1a1</title>
  <style>
    :root {
      /* Ljust läge (Standard) */
      --bg-main: #f4f6f9;
      --bg-header: #ffffff;
      --bg-card: #ffffff;
      --bg-card-alt: #f1f5f9;
      --bg-input: #ffffff;
      --bg-completed: #f8fafc;
      --accent: #d97706;
      --accent-hover: #b45309;
      --accent-text: #ffffff;
      --blue: #0369a1;
      --blue-bg: #e0f2fe;
      --green: #15803d;
      --green-bg: #dcfce7;
      --red: #b91c1c;
      --red-bg: #fee2e2;
      --purple: #7e22ce;
      --purple-bg: #f3e8ff;
      --text-main: #0f172a;
      --text-heading: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    body.dark-mode {
      --bg-main: #12161c;
      --bg-header: #0d1117;
      --bg-card: #1b222c;
      --bg-card-alt: #232c38;
      --bg-input: #101419;
      --bg-completed: #161d26;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --accent-text: #111827;
      --blue: #38bdf8;
      --blue-bg: rgba(56, 189, 248, 0.14);
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.15);
      --red: #f87171;
      --red-bg: rgba(248, 113, 113, 0.15);
      --purple: #c084fc;
      --purple-bg: rgba(192, 132, 252, 0.15);
      --text-main: #f3f4f6;
      --text-heading: #ffffff;
      --text-muted: #cbd5e1;
      --border: #334155;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 18px;
      line-height: 1.65;
      letter-spacing: 0.012em;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Sticky Top Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-header);
      border-bottom: 2px solid var(--border);
      padding: 10px 18px;
      box-shadow: var(--shadow);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.12rem;
      color: var(--accent);
    }

    .brand-badge {
      background: var(--accent);
      color: var(--accent-text);
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Level Segmented Switch */
    .level-switch {
      display: inline-flex;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .level-btn {
      padding: 6px 11px;
      font-size: 0.86rem;
      font-weight: 800;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .level-btn.active-e {
      background-color: var(--green-bg);
      color: var(--green);
      border-color: var(--green);
    }

    .level-btn.active-ca {
      background-color: var(--purple-bg);
      color: var(--purple);
      border-color: var(--purple);
    }

    .voice-select {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      max-width: 175px;
      cursor: pointer;
    }

    .progress-wrap {
      max-width: 980px;
      margin: 8px auto 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #f59e0b);
      transition: width 0.35s ease;
    }

    /* Main Container */
    main {
      max-width: 980px;
      margin: 22px auto 64px;
      padding: 0 16px;
    }

    /* Teacher Walkthrough Panel (Shift+L) */
    .teacher-panel {
      background: linear-gradient(135deg, #1e1b4b, #172554);
      border: 2px solid #818cf8;
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      color: #f8fafc;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 1rem;
    }

    .teacher-panel-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .teacher-title {
      font-weight: 800;
      font-size: 1.1rem;
      color: #e0e7ff;
    }

    .teacher-overview-box {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(129, 140, 248, 0.45);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 10px 0 14px;
      color: #f1f5f9;
      line-height: 1.55;
    }

    .teacher-nav-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .teacher-stage-btn {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 11px;
      font-size: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
    }

    .teacher-stage-btn.active {
      background: #6366f1;
      border-color: #a5b4fc;
      color: #ffffff;
    }

    .teacher-action-btn {
      background: #312e81;
      color: #e0e7ff;
      border: 1px solid #818cf8;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    h1, h2, h3 {
      margin-top: 0;
      line-height: 1.3;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--accent);
    }

    h2 {
      font-size: 1.42rem;
      color: var(--text-heading);
    }

    h3 {
      font-size: 1.15rem;
      color: var(--accent);
    }

    .tag {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .tag-e {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .tag-ca {
      background: var(--purple-bg);
      color: var(--purple);
      border: 1px solid var(--purple);
    }

    .tag-pair {
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue);
    }

    /* Key Words Box (Begreppshjälp i E-läge) */
    .vocab-box {
      background-color: var(--blue-bg);
      border-left: 5px solid var(--blue);
      border-radius: 10px;
      padding: 14px 18px;
      margin: 14px 0 20px;
    }

    .vocab-box-title {
      font-weight: 800;
      color: var(--blue);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .vocab-box ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }

    .vocab-box li {
      margin-bottom: 5px;
    }

    /* Question Clarification Helper */
    .sub-clarify {
      display: block;
      font-size: 0.96rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Stacked Completed Answers */
    .history-stack {
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-header {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .completed-card {
      background-color: var(--bg-completed);
      border: 1px solid var(--border);
      border-left: 5px solid var(--green);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .completed-q {
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .completed-a {
      background-color: var(--green-bg);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .completed-exp {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .active-question-box {
      background-color: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
    }

    /* Tap-to-Fill Sentence Builder (Lucktext) */
    .sentence-builder {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      font-size: 1.18rem;
      font-weight: 600;
      line-height: 2.1;
      margin: 14px 0;
    }

    .blank-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 125px;
      padding: 2px 12px;
      margin: 0 4px;
      border-radius: 8px;
      border: 2px dashed var(--accent);
      background-color: var(--bg-card);
      color: var(--accent);
      font-weight: 800;
      cursor: pointer;
      vertical-align: baseline;
    }

    .blank-slot.filled {
      border-style: solid;
      background-color: var(--blue-bg);
      border-color: var(--blue);
      color: var(--blue);
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    .word-chip {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .word-chip:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .word-chip.used {
      opacity: 0.4;
      cursor: default;
    }

    /* Cooldown Banner */
    .cooldown-banner {
      background-color: var(--red-bg);
      border: 1px solid var(--red);
      color: var(--red);
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 12px;
      text-align: center;
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      padding: 12px 18px;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 1.08rem;
      padding: 14px 24px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-tts {
      background-color: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 7px 13px;
      font-size: 0.92rem;
      flex-shrink: 0;
    }

    .btn-tts:hover {
      filter: brightness(0.95);
    }

    .btn-tts.speaking {
      background-color: var(--blue);
      color: #ffffff;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(3, 105, 161, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(3, 105, 161, 0); }
      100% { box-shadow: 0 0 0 0 rgba(3, 105, 161, 0); }
    }

    /* Inputs & Starter Chips */
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"], textarea {
      width: 100%;
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .no-paste-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .starter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chip-btn {
      background-color: var(--bg-card);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 8px;
    }

    .chip-btn:hover {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    /* Choice Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    @media (min-width: 700px) {
      .options-grid.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--border);
      text-align: left;
      justify-content: flex-start;
      padding: 15px 18px;
      font-weight: 600;
      line-height: 1.45;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .option-btn.selected {
      border-color: var(--blue);
      background-color: var(--blue-bg);
    }

    .option-btn.correct {
      border-color: var(--green);
      background-color: var(--green-bg);
      color: var(--text-main);
    }

    .option-btn.wrong {
      border-color: var(--red);
      background-color: var(--red-bg);
      color: var(--text-main);
    }

    /* Feedback Box */
    .feedback-box {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 10px;
      border-left: 5px solid var(--blue);
      background-color: var(--bg-card-alt);
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.ok {
      border-left-color: var(--green);
      background-color: var(--green-bg);
    }

    .feedback-box.err {
      border-left-color: var(--red);
      background-color: var(--red-bg);
    }

    /* Pair Discussion Box */
    .pair-box {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--blue);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 18px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Source Comparison Cards */
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin: 16px 0;
    }

    @media (min-width: 740px) {
      .compare-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .source-card {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .source-card.social {
      border-top: 6px solid var(--red);
    }

    .source-card.science {
      border-top: 6px solid var(--green);
    }

    /* Oral Timer */
    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-card-alt);
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Toast Warning */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #991b1b;
      color: #ffffff;
      border: 2px solid #f87171;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      z-index: 9999;
      display: none;
      max-width: 90vw;
      text-align: center;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .summary-textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      min-height: 320px;
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--green);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-badge">Lektion 1 av 3</span>
      <span>Vetenskapsdetektiven</span>
    </div>
    <div class="top-controls">
      <div class="level-switch" role="group" aria-label="Välj svårighetsnivå">
        <button type="button" class="level-btn active-e" id="btnModeE" onclick="setLevelMode('E')">
          🟢 E-nivå
        </button>
        <button type="button" class="level-btn" id="btnModeCA" onclick="setLevelMode('CA')">
          🟣 C/A-nivå
        </button>
      </div>
      <select id="voiceSelect" class="voice-select" title="Välj röst för uppläsning" onchange="selectVoice(this.value)">
        <option value="">🗣️ Laddar röster...</option>
      </select>
      <button type="button" class="btn-tts" id="btnAutoTts" onclick="toggleAutoTts()">
        🔊 Auto-ljud: AV
      </button>
      <button type="button" class="btn-secondary" style="padding: 7px 10px; font-size: 0.88rem;" onclick="stopSpeech()">
        ⏹ Stopp
      </button>
      <button type="button" class="btn-secondary" id="btnTheme" style="padding: 7px 10px; font-size: 0.88rem;" onclick="toggleTheme()">
        🌙 Mörkt läge
      </button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="stageLabel">Start: Par-incheckning</span>
      <span id="timeEstimate">Ca 40 min totalt</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>
</header>

<main id="appContainer"></main>

<div id="toast"></div>

<script>
/* =========================================================
   1. NATURAL SWEDISH TEXT-TO-SPEECH (CHROMEBOOK OPTIMIZED)
   ========================================================= */
let availableSvVoices = [];
let selectedVoiceURI = '';
let autoTts = false;
let currentSpeakBtn = null;
let speechQueue = [];
let isSpeakingQueue = false;

function scoreSwedishVoice(voice) {
  const name = (voice.name || '').toLowerCase();
  const lang = (voice.lang || '').toLowerCase();
  let score = 0;

  if (lang === 'sv-se') score += 40;
  else if (lang.startsWith('sv')) score += 20;

  if (name.includes('google')) score += 100;
  if (name.includes('natural') || name.includes('neural') || name.includes('online')) score += 90;
  if (name.includes('alva') || name.includes('klara') || name.includes('oskar') || name.includes('sofie') || name.includes('mattias')) score += 70;
  if (!voice.localService) score += 30;

  if (name.includes('espeak') || name.includes('compact') || name.includes('android')) score -= 60;

  return score;
}

function loadSwedishVoices() {
  if (!('speechSynthesis' in window)) return;
  const allVoices = window.speechSynthesis.getVoices();
  if (!allVoices || allVoices.length === 0) return;

  const svVoices = allVoices
    .filter(v => (v.lang || '').toLowerCase().startsWith('sv'))
    .sort((a, b) => scoreSwedishVoice(b) - scoreSwedishVoice(a));

  availableSvVoices = svVoices;

  const selectEl = document.getElementById('voiceSelect');
  if (!selectEl) return;

  if (svVoices.length === 0) {
    selectEl.innerHTML = `<option value="">🗣️ Standardröst</option>`;
    return;
  }

  if (!selectedVoiceURI || !svVoices.some(v => v.voiceURI === selectedVoiceURI)) {
    selectedVoiceURI = svVoices[0].voiceURI;
  }

  selectEl.innerHTML = svVoices.map((v, i) => {
    const cleanName = v.name
      .replace(/Microsoft |Google |Desktop |\(Sweden\)|Swedish/gi, '')
      .trim() || `Svensk röst ${i + 1}`;
    const tag = i === 0 ? ' ⭐' : '';
    return `<option value="${escapeHtml(v.voiceURI)}" ${v.voiceURI === selectedVoiceURI ? 'selected' : ''}>🗣️ ${escapeHtml(cleanName)}${tag}</option>`;
  }).join('');
}

function selectVoice(uri) {
  selectedVoiceURI = uri;
  speakText("Hej! Så här låter den här rösten.");
}

if ('speechSynthesis' in window) {
  loadSwedishVoices();
  window.speechSynthesis.onvoiceschanged = loadSwedishVoices;
}

function stopSpeech() {
  speechQueue = [];
  isSpeakingQueue = false;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  if (currentSpeakBtn) {
    currentSpeakBtn.classList.remove('speaking');
    currentSpeakBtn = null;
  }
}

function splitIntoSentences(text) {
  const clean = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  return clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g).map(s => s.trim()).filter(Boolean);
}

function speakNextInQueue() {
  if (speechQueue.length === 0) {
    isSpeakingQueue = false;
    if (currentSpeakBtn) {
      currentSpeakBtn.classList.remove('speaking');
      currentSpeakBtn = null;
    }
    return;
  }

  const sentence = speechQueue.shift();
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = 'sv-SE';

  const chosenVoice = availableSvVoices.find(v => v.voiceURI === selectedVoiceURI) || availableSvVoices[0];
  if (chosenVoice) {
    utterance.voice = chosenVoice;
  }

  utterance.rate = 0.94;
  utterance.pitch = 1.02;

  utterance.onend = () => {
    if (isSpeakingQueue) {
      setTimeout(speakNextInQueue, 120);
    }
  };
  utterance.onerror = () => {
    stopSpeech();
  };

  window.speechSynthesis.speak(utterance);
}

function speakText(text, btnEl = null) {
  if (!('speechSynthesis' in window)) {
    showToast("Din webbläsare stöder tyvärr inte uppläsning.");
    return;
  }
  stopSpeech();
  loadSwedishVoices();

  const sentences = splitIntoSentences(text);
  if (sentences.length === 0) return;

  if (btnEl) {
    currentSpeakBtn = btnEl;
    btnEl.classList.add('speaking');
  }

  speechQueue = sentences;
  isSpeakingQueue = true;
  speakNextInQueue();
}

function speakFromBtn(btnEl) {
  const text = btnEl.getAttribute('data-tts') || '';
  speakText(text, btnEl);
}

function toggleAutoTts() {
  autoTts = !autoTts;
  const btn = document.getElementById('btnAutoTts');
  btn.textContent = autoTts ? '🔊 Auto-ljud: PÅ' : '🔊 Auto-ljud: AV';
  if (autoTts) {
    speakText("Automatisk uppläsning är nu på.");
  } else {
    stopSpeech();
  }
}

function ttsButton(textToRead, label = "Lyssna") {
  return `<button type="button" class="btn-tts" data-tts="${escapeHtml(textToRead)}" onclick="speakFromBtn(this)">🔊 ${escapeHtml(label)}</button>`;
}

    render();
  }, 1000);

   3. ANTI-PASTE & TOAST GUARDRAILS
   ========================================================= */
let toastTimeout = null;
function showToast(msg, isSuccess = false) {
  const el = document.getElementById('toast');
  el.style.backgroundColor = isSuccess ? '#14532d' : '#991b1b';
  el.style.borderColor = isSuccess ? '#22c55e' : '#f87171';
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    el.style.display = 'none';
  }, 3600);
}

function attachAntiPaste(el) {
  if (!el) return;
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    showToast("🚫 Klistra in är avstängt! Skriv svaret med era egna ord.");
  });
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    showToast("🚫 Dra-och-släpp är avstängt! Skriv med egna ord.");
  });

  let lastVal = el.value || '';
  el.addEventListener('input', () => {
    const diff = el.value.length - lastVal.length;
    if (diff > 18) {
      el.value = lastVal;
      showToast("🚫 För många tecken på en gång! Skriv svaret själva.");
    } else {
      lastVal = el.value;
    }
  });
}

function wireAllNoPasteInputs() {
  document.querySelectorAll('.no-paste').forEach(attachAntiPaste);
}

function insertStarter(textareaId, starterText) {
  const el = document.getElementById(textareaId);
  if (!el) return;
  el.value = starterText;
  el.focus();
  el.dispatchEvent(new Event('input'));
}

/* =========================================================
   5. TEACHER WALKTHROUGH MODE (Shift+L / Shift+F)
   ========================================================= */
document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (e.shiftKey && (e.code === 'KeyL' || e.key === 'L' || e.key === 'l')) {
    e.preventDefault();
    toggleTeacherMode();
  } else if (e.shiftKey && (e.code === 'KeyF' || e.key === 'F' || e.key === 'f')) {
    e.preventDefault();
    demoForwardStep();
  }
});

function toggleTeacherMode() {
  state.teacherMode = !state.teacherMode;
  if (state.teacherMode) {
    state.teacherOverviewExpanded = true;
    showToast("📋 Lektionsöversikt visad för genomgång!", true);
  } else {
    showToast("Lektionsöversikt stängd.");
  }
  render();
}

function jumpToStage(targetStage) {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  state.stage = targetStage;
  render();
}

function demoForwardStep() {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  const isCA = state.levelMode === 'CA';
  cooldownSeconds = 0;
  clearInterval(cooldownTimer);

  if (state.stage === 0) {
    if (!state.classGroup) state.classGroup = "BA23A";
    state.stage = 1;
    render();
    return;
  }

  if (state.stage === 1) {
    const qList = isCA ? s1QuestionsCA : s1StepsE;
    if (state.s1Index < qList.length) {
      const step = qList[state.s1Index];
      if (!isCA && step.type === 'fill') {
        state.s1FillSlots = [...step.answers];
        checkS1Fill();
      } else {
        const correctIdx = step.options.findIndex(o => o.correct);
        answerS1(correctIdx);
      }
    } else {
      if (!state.pair1Text || state.pair1Text.length < 15) {
        state.pair1Text = "En hypotes är ett testbart påstående om sambandet mellan två faktorer. Ett vetenskapligt experiment ändrar en faktor i taget och kan upprepas.";
      }
      state.pair1PeerChecks = [true, true];
      state.stage = 2;
      render();
    }
    return;
  }

  if (state.stage === 2) {
    const items = isCA ? s2ItemsCA : s2ItemsE;
    if (!isCA && !state.s2VocabDone && state.s2History.length === 0) {
      answerS2Vocab(true);
    } else if (state.s2Index < items.length) {
      const item = items[state.s2Index];
      if (state.s2Step === 'classify') {
        chooseS2Type(item.type);
      } else {
        const correctIdx = item.reasons.findIndex(r => r.correct);
        chooseS2Reason(correctIdx);
      }
    } else {
      state.stage = 3;
      render();
    }
    return;
  }

  if (state.stage === 3) {
    if (!state.s3DefCorrect) {
      answerS3Def(true);
    } else if (state.s3ReasonsScore < 2) {
      state.s3ReasonsSelected = ['method', 'peer'];
      checkS3Reasons();
    } else {
      if (!state.pair2Text || state.pair2Text.length < 15) {
        state.pair2Text = "1. Den vetenskapliga artikeln bygger på vetenskaplig metod och experiment. 2. Den är granskad av andra oberoende forskare och saknar säljintresse.";
      }
      state.pair2PeerChecks = [true, true];
      state.stage = 4;
      render();
    }
    return;
  }

  if (state.stage === 4) {
    const cards = isCA ? s4CardsCA : s4CardsE;
    if (state.s4Index < cards.length) {
      const correctIdx = cards[state.s4Index].options.findIndex(o => o.correct);
      answerS4(correctIdx);
    } else {
      state.stage = 5;
      render();
    }
    return;
  }

  if (state.stage === 5) {
    if (!state.s5Revealed) {
      state.s5OralChecks = [true, true];
      revealOral();
    } else {
      rateOral('green');
    }
    return;
  }

  if (state.stage === 6) {
    if (!state.caChoiceCorrect) {
      answerCaChoice(true);
    } else {
      if (!state.caText || state.caText.length < 10) {
        state.caText = "Om andra forskare upprepar experimentet kan man avslöja forskningsfusk eller slumpfel och se om resultatet verkligen stämmer.";
      }
      state.didBonus = true;
      state.stage = 7;
      render();
    }
    return;
  }

  if (state.stage === 7) {
    showToast("Ni är redan på sista sidan (Sammanfattning)!", true);
  }
}

  document.getElementById('progressBar').style.width = meta.pct + '%';

function render() {
  stopSpeech();
  clearInterval(oralInterval);
  state.s5TimerRunning = false;
  updateHeader();

  const container = document.getElementById('appContainer');
  let html = renderTeacherBanner();

  if (state.stage === 0) html += renderStart();
  else if (state.stage === 1) html += renderStage1();
  else if (state.stage === 2) html += renderStage2();
  else if (state.stage === 3) html += renderStage3();
  else if (state.stage === 4) html += renderStage4();
  else if (state.stage === 5) html += renderStage5();
  else if (state.stage === 6) html += renderStage6();
  else if (state.stage === 7) html += renderSummary();

  container.innerHTML = html;
  wireAllNoPasteInputs();

  if (autoTts) {
    const autoTarget = document.querySelector('[data-autoread]');
    if (autoTarget) {
      setTimeout(() => speakText(autoTarget.getAttribute('data-autoread')), 250);
    }
  }
}

function startApp() {
  const s1 = document.getElementById('inpS1').value.trim();
  const s2 = document.getElementById('inpS2').value.trim();
  const cls = document.getElementById('inpClass').value.trim();
  if (!s1) {
    showToast("Skriv in minst ett namn innan ni startar!");
    return;
  }
  state.student1 = s1;
  state.student2 = s2 || "Ingen parkompis angiven";
  state.classGroup = cls;
  state.startTime = Date.now();
  state.stage = 1;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 1: HYPOTES & EXPERIMENT --- */
function renderStage1() {
  const isCA = state.levelMode === 'CA';
  const qList = isCA ? s1QuestionsCA : s1StepsE;
  const vocabAudio = "Viktiga begrepp i Etapp 1: Hypotes är ett testbart påstående, inte en fråga, om hur två faktorer hänger ihop. Vetenskapligt experiment betyder att man ändrar en faktor i taget, mäter resultatet och beskriver så andra kan upprepa försöket.";

  let historyHtml = '';
  if (state.s1History.length > 0) {
    historyHtml = `
      <div class="history-stack">
        <div class="history-header">✅ Era klara svar i Etapp 1 (använd som hjälp nedan):</div>
        ${state.s1History.map((h, i) => `
          <div class="completed-card">
            <div class="completed-q">${i + 1}. ${escapeHtml(h.prompt)}</div>
            <div class="completed-a">✓ Rätt svar: ${escapeHtml(h.chosenText)}</div>

      </div>
    `;

    const step = qList[state.s1Index];

    if (!isCA && step.type === 'fill') {
      const slot0 = state.s1FillSlots[0];
      const slot1 = state.s1FillSlots[1];
      const fullAudio = `${step.prompt} ${step.parts[0]} lucka 1 ${step.parts[1]} lucka 2 ${step.parts[2]}`;

      currentPartHtml = `
        <div class="active-question-box">
          <div class="card-header-row">
            <div>
              <span class="tag tag-e">E-nivå • ${escapeHtml(step.badge)}</span>
              <p style="font-size: 1.15rem; font-weight: 700; margin: 4px 0 0 0;" data-autoread="${escapeHtml(fullAudio)}">
                ${escapeHtml(step.prompt)}
              </p>
            </div>
            ${ttsButton(fullAudio, "Lyssna")}
          </div>

          <div class="sentence-builder">
            ${escapeHtml(step.parts[0])}
            <span class="blank-slot ${slot0 ? 'filled' : ''}" onclick="clearS1Slot(0)" title="Klicka för att ta bort ord">
              ${slot0 ? escapeHtml(slot0) : '1. [ Välj ord ]'}
            </span>
            ${escapeHtml(step.parts[1])}
            <span class="blank-slot ${slot1 ? 'filled' : ''}" onclick="clearS1Slot(1)" title="Klicka för att ta bort ord">

            </span>
            ${escapeHtml(step.parts[2])}
          </div>

          <div class="word-bank">
            ${step.bank.map(word => {
              const isUsed = state.s1FillSlots.includes(word);
              return `
                <button type="button" class="word-chip ${isUsed ? 'used' : ''}" ${isUsed || cooldownSeconds > 0 ? 'disabled' : ''} onclick="pickS1Word('${escapeHtml(word)}')">
                  ${escapeHtml(word)}
                </button>
              `;
            }).join('')}
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 10px;">
            <button type="button" class="btn-primary" ${!slot0 || !slot1 || cooldownSeconds > 0 ? 'disabled' : ''} onclick="checkS1Fill()">
              Kontrollera meningen ✓
            </button>
            <button type="button" class="btn-secondary" onclick="state.s1FillSlots = [null, null]; render();">
              Rensa luckor
            </button>
          </div>

          ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Läs orden noga! Ni kan svara igen om ${cooldownSeconds} sek...</div>` : ''}
        </div>
      `;
    } else {
      const fullAudio = `${step.prompt}. ${step.options.map((o, i) => `Alternativ ${i + 1}: ${o.text}`).join('. ')}.`;
      currentPartHtml = `
        <div class="active-question-box">
          <div class="card-header-row">
            <div>
              <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">${isCA ? 'C/A-nivå' : 'E-nivå'} • ${escapeHtml(step.badge)}</span>

                ${escapeHtml(step.prompt)}
              </p>
            </div>
            ${ttsButton(fullAudio, "Lyssna")}
          </div>

          <div class="options-grid">

    const pairPrompt = "Par-snack 1: Turas om att förklara högt för varandra med egna ord. 1. Vad är en hypotes? 2. Vad kännetecknar ett vetenskapligt experiment? Alltså: vad krävs för att en undersökning ska räknas som ett riktigt vetenskapligt experiment? Lyssna på varandra och kryssa i att kompisen fick med nyckelorden.";
    currentPartHtml = `
      <div class="pair-box">
        <div class="card-header-row">
          <div>
            <span class="tag tag-pair">🗣️ Par-snack #1 • Muntlig kompis-check</span>
            <h3>Förklara högt – kompisen checkar nyckelorden!</h3>
          </div>
          ${ttsButton(pairPrompt, "Lyssna")}
        </div>
        <p data-autoread="${escapeHtml(pairPrompt)}">
          På provet ska ni förklara begreppen muntligt. Gör så här nu:
        </p>
        <ol>
          <li>
            <strong>${escapeHtml(state.student1)}</strong> förklarar högt: <em>”Vad är en hypotes?”</em>
          </li>
          <li>
            <strong>${escapeHtml(state.student2)}</strong> förklarar högt: <em>”Vad kännetecknar ett vetenskapligt experiment?”</em>
            <span class="sub-clarify">(Vad krävs för att en undersökning ska räknas som ett riktigt vetenskapligt experiment?)</span>
          </li>
        </ol>

        <div style="margin: 14px 0;">
          <strong>✅ Kompis-check (kryssa i när ni hört varandra säga detta högt):</strong>

            <input type="checkbox" id="chkPair1A" ${state.pair1PeerChecks[0] ? 'checked' : ''} onchange="state.pair1PeerChecks[0] = this.checked" />
            <span>Kompisen sa att en hypotes är ett <strong>påstående</strong> (inte en fråga) om hur <strong>två faktorer</strong> hänger ihop.</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="chkPair1B" ${state.pair1PeerChecks[1] ? 'checked' : ''} onchange="state.pair1PeerChecks[1] = this.checked" />
            <span>Kompisen sa att man ändrar <strong>en faktor i taget</strong> och beskriver så andra kan <strong>upprepa</strong> försöket.</span>
          </label>
        </div>

        <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med era egna ord</div>
        <label for="txtPair1">Skriv ner era två förklaringar kort (sparas till Classroom):</label>
        ${!isCA ? `
          <div class="starter-chips">
            <button type="button" class="chip-btn" onclick="insertStarter('txtPair1', 'En hypotes är ett påstående om hur två faktorer hänger ihop. I ett vetenskapligt experiment ändrar man ')">
              + Starta meningen åt oss
            </button>
          </div>
        ` : ''}
        <textarea id="txtPair1" class="no-paste" rows="3" placeholder="En hypotes är... Ett vetenskapligt experiment kännetecknas av att...">${escapeHtml(state.pair1Text)}</textarea>

        <div class="nav-footer">
          <button type="button" class="btn-secondary" onclick="resetStage1()">← Gör om frågorna</button>
          <button type="button" class="btn-primary" onclick="finishStage1()">Vidare till Etapp 2 →</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">${isCA ? '🟣 C/A-nivå' : '🟢 E-nivå'} • Etapp 1 av 5</span>
          <h2>Hypotes & Vetenskapligt experiment</h2>
        </div>
        <span style="font-weight: 700; color: var(--text-muted);">${state.s1History.length} / ${qList.length} klara</span>
      </div>

      ${!isCA ? `
        <div class="vocab-box">
          <div class="vocab-box-title">
            <span>🔑 Nyckelord i Etapp 1</span>
            ${ttsButton(vocabAudio, "Lyssna")}
          </div>
          <ul>
            <li><strong>Hypotes:</strong> Ett testbart <strong>påstående</strong> (inte en fråga) om hur <strong>två faktorer</strong> hänger ihop.</li>
            <li><strong>Vad kännetecknar ett vetenskapligt experiment?</strong> <em>(Vad som krävs):</em> 1) Ändra bara <strong>en faktor</strong> i taget, 2) mät resultatet, och 3) beskriv så tydligt att andra kan <strong>upprepa</strong> försöket.</li>
          </ul>
        </div>
      ` : ''}

      ${historyHtml}
      ${currentPartHtml}
    </div>
  `;
}

function pickS1Word(word) {
  if (state.s1FillSlots[0] === null) {
    state.s1FillSlots[0] = word;
  } else if (state.s1FillSlots[1] === null) {
    state.s1FillSlots[1] = word;
  }
  render();
}

function clearS1Slot(slotIdx) {
  state.s1FillSlots[slotIdx] = null;
  render();
}

function checkS1Fill() {
  const step = s1StepsE[state.s1Index];
  if (!step || step.type !== 'fill') return;
  const ok = state.s1FillSlots[0] === step.answers[0] && state.s1FillSlots[1] === step.answers[1];
  if (!ok) {
    state.s1FillSlots = [null, null];
    triggerClickCooldown("Inte riktigt! Läs i den blå rutan högst upp och välj rätt två ord.");
    return;
  }

  state.s1Score++;
  state.s1History.push({
    prompt: step.completedQ,
    chosenText: step.completedA,
    explanation: step.explanation
  });
  state.s1FillSlots = [null, null];
  state.s1Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function answerS1(idx) {
  if (cooldownSeconds > 0) return;
  const qList = state.levelMode === 'CA' ? s1QuestionsCA : s1StepsE;
  const q = qList[state.s1Index];
  const chosen = q.options[idx];
  if (!chosen.correct) {
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs alternativen noga och försök igen.");
    return;
  }

  state.s1Score++;
  state.s1History.push({
    prompt: q.prompt,
    chosenText: chosen.text,
    explanation: q.explanation
  });
  state.s1Index++;
  render();
  if (autoTts) {
    speakText("Rätt! " + q.explanation);
  }
}

function resetStage1() {
  state.s1Index = 0;
  state.s1Score = 0;
  state.s1History = [];
  state.s1FillSlots = [null, null];
  render();
}

function finishStage1() {
  const txt = document.getElementById('txtPair1').value.trim();
  const c1 = document.getElementById('chkPair1A').checked;
  const c2 = document.getElementById('chkPair1B').checked;
  if (!c1 || !c2) {
    showToast("Kryssa i båda kompis-checkarna när ni har sagt nyckelorden högt!");
    return;
  }
  if (txt.length < 15) {
    showToast("Skriv minst en mening om hypotes och experiment innan ni går vidare!");
    return;
  }
  state.pair1Text = txt;
  state.pair1PeerChecks = [c1, c2];
  state.stage = 2;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 2: PSEUDOSCIENCE VS NATURAL SCIENCE --- */
function renderStage2() {
  const isCA = state.levelMode === 'CA';
  const items = isCA ? s2ItemsCA : s2ItemsE;
  const disabledAttr = cooldownSeconds > 0 ? 'disabled' : '';
  const vocabAudio = "Nyckelord i Etapp 2: Naturvetenskap går att testa i experiment och ger samma resultat när man upprepar det. Pseudovetenskap betyder låtsas-vetenskap. Den använder fina ord men saknar bevis.";

  let historyHtml = '';
  if (state.s2VocabDone || state.s2History.length > 0) {
    historyHtml += `<div class="history-stack">
      <div class="history-header">✅ Era klara svar i Etapp 2:</div>`;

    if (state.s2VocabDone) {
      historyHtml += `
        <div class="completed-card">
          <div class="completed-q">Begrepps-koll: Vad betyder ordet PSEUDOVETENSKAP?</div>
          <div class="completed-a">✓ Rätt svar: Låtsas-vetenskap som låter teknisk men saknar bevis.</div>
          <div class="completed-exp">Ordet "pseudo" betyder falsk eller låtsas.</div>
        </div>
      `;
    }

    state.s2History.forEach((h, i) => {
      historyHtml += `
        <div class="completed-card">
          <div class="completed-q">Påstående ${i + 1}: ${escapeHtml(h.claim)}</div>
          <div class="completed-a">✓ ${escapeHtml(h.typeLabel)} – ${escapeHtml(h.reasonText)}</div>
          <div class="completed-exp">${escapeHtml(h.feedback)}</div>
        </div>
      `;
    });

    historyHtml += `</div>`;
  }

  let activeHtml = '';
  if (!isCA && !state.s2VocabDone && state.s2History.length === 0) {
    const qAudio = "Begrepps-koll: Vad betyder ordet pseudovetenskap? Alternativ 1: Riktig vetenskap som testats i ett labb. Alternativ 2: Låtsas-vetenskap som låter teknisk men saknar bevis. Alternativ 3: En metod för att mäta buller och ljud.";
    activeHtml = `
      <div class="active-question-box">
        <div class="card-header-row">
          <div>
            <span class="tag tag-e">Begrepps-koll • Starta här</span>
            <p style="font-size: 1.15rem; font-weight: 700; margin: 4px 0 0 0;" data-autoread="${escapeHtml(qAudio)}">
              Vad betyder ordet <strong>pseudovetenskap</strong>?
            </p>
          </div>
          ${ttsButton(qAudio, "Lyssna")}
        </div>
        <div class="options-grid">
          <button type="button" class="option-btn" ${disabledAttr} onclick="answerS2Vocab(false)">
            Riktig vetenskap som testats i ett labb.
          </button>
          <button type="button" class="option-btn" ${disabledAttr} onclick="answerS2Vocab(true)">
            Låtsas-vetenskap som låter teknisk men saknar bevis.
          </button>
          <button type="button" class="option-btn" ${disabledAttr} onclick="answerS2Vocab(false)">
            En metod för att mäta buller och ljud.
          </button>
        </div>
        ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Läs alternativen noga! Ni kan svara igen om ${cooldownSeconds} sek...</div>` : ''}
      </div>
    `;
  } else if (state.s2Index < items.length) {
    const item = items[state.s2Index];
    const audioTxt = `Påstående ${state.s2Index + 1} av ${items.length}: ${item.claim}. Är detta naturvetenskap eller pseudovetenskap?`;

    activeHtml = `
      <div class="active-question-box">
        <div class="card-header-row">
          <div>
            <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">Påstående ${state.s2Index + 1} av ${items.length}</span>
            <p style="font-size: 1.18rem; font-weight: 700; margin: 6px 0 0 0;" data-autoread="${escapeHtml(audioTxt)}">
              ${escapeHtml(item.claim)}
            </p>
          </div>
          ${ttsButton(audioTxt, "Lyssna")}
        </div>

        <p><strong>Steg 1:</strong> Vad är det här för typ av påstående?</p>
        <div class="options-grid two-col">
          <button type="button" class="option-btn ${state.s2ChosenType === 'science' ? (item.type === 'science' ? 'correct' : 'wrong') : ''}"
            ${state.s2Step === 'reason' || cooldownSeconds > 0 ? 'disabled' : ''} onclick="chooseS2Type('science')">
            🔬 Naturvetenskap
          </button>
          <button type="button" class="option-btn ${state.s2ChosenType === 'pseudo' ? (item.type === 'pseudo' ? 'correct' : 'wrong') : ''}"
            ${state.s2Step === 'reason' || cooldownSeconds > 0 ? 'disabled' : ''} onclick="chooseS2Type('pseudo')">
            🔮 Pseudovetenskap
          </button>
        </div>

        ${state.s2Step === 'reason' ? `
          <div style="margin-top: 18px;">
            <p><strong>Steg 2:</strong> Varför? Välj rätt motivering:</p>
            <div class="options-grid">
              ${item.reasons.map((r, idx) => `
                <button type="button" class="option-btn" ${disabledAttr} onclick="chooseS2Reason(${idx})">
                  ${escapeHtml(r.text)}
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Tänk efter i ${cooldownSeconds} sek innan ni väljer igen...</div>` : ''}
      </div>
    `;
  } else {
    activeHtml = `
      <div class="feedback-box show ok">
        <strong>🎉 Snyggt jobbat!</strong> Ni har klarat alla påståenden i Etapp 2.
      </div>
      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 1; window.scrollTo({top:0, behavior:'smooth'}); render();">← Tillbaka till Etapp 1</button>
        <button type="button" class="btn-primary" onclick="state.stage = 3; window.scrollTo({top:0, behavior:'smooth'}); render();">Vidare till Etapp 3 (Källkritik) →</button>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">${isCA ? '🟣 C/A-nivå' : '🟢 E-nivå'} • Etapp 2 av 5</span>
          <h2>Naturvetenskap eller Pseudovetenskap?</h2>
        </div>
        <span style="font-weight: 700; color: var(--text-muted);">${state.s2History.length} / ${items.length} påståenden</span>
      </div>

      ${!isCA ? `
        <div class="vocab-box">
          <div class="vocab-box-title">
            <span>🔑 Nyckelord i Etapp 2</span>
            ${ttsButton(vocabAudio, "Lyssna")}
          </div>
          <ul>
            <li><strong>Naturvetenskap:</strong> Går att testa i experiment och ger samma resultat när man upprepar det.</li>

      ${activeHtml}

}

function answerS2Vocab(isOk) {
  if (cooldownSeconds > 0) return;
  if (!isOk) {
    triggerClickCooldown("Tips: 'Pseudo' betyder falsk eller låtsas. Läs i den blå rutan!");
    return;
  }
  state.s2VocabDone = true;
  render();
  if (autoTts) speakText("Rätt! Pseudovetenskap betyder låtsas-vetenskap.");
}

function chooseS2Type(type) {
  if (cooldownSeconds > 0) return;
  const items = state.levelMode === 'CA' ? s2ItemsCA : s2ItemsE;
  const item = items[state.s2Index];
  state.s2ChosenType = type;
  if (type === item.type) {
    state.s2Step = 'reason';
    render();
  } else {
    triggerClickCooldown("Inte riktigt! Går påståendet att mäta och testa i ett riktigt experiment?");
  }
}

function chooseS2Reason(idx) {
  if (cooldownSeconds > 0) return;
  const items = state.levelMode === 'CA' ? s2ItemsCA : s2ItemsE;
  const item = items[state.s2Index];
  const reasonObj = item.reasons[idx];
  if (!reasonObj.correct) {
    triggerClickCooldown(reasonObj.trap || "Läs båda motiveringarna noga!");
    return;
  }

  state.s2Score++;
  state.s2History.push({
    claim: item.claim,
    typeLabel: item.type === 'science' ? 'Naturvetenskap' : 'Pseudovetenskap',
    reasonText: reasonObj.text,
    feedback: item.feedback
  });

  state.s2Index++;
  state.s2Step = 'classify';
  state.s2ChosenType = null;
  render();
  if (autoTts) speakText(item.feedback);
}

/* --- STAGE 3: KÄLLKRITIK --- */

  const isCA = state.levelMode === 'CA';
  const reasonOpts = isCA ? s3ReasonOptionsCA : s3ReasonOptionsE;
  const vocabAudio = "Nyckelord i Etapp 3: Källkritisk betyder att bedöma om det man läser går att lita på. Kollegial granskning betyder att andra oberoende forskare kontrollerar studien innan den publiceras.";
  const introAudio = "Etapp 3: Källkritik. Först: Vad menas med att någon är källkritisk? Jämför sedan inlägget från StarkBygg-Jocke med den vetenskapliga artikeln.";

  return `
    <div class="card">
      <div class="card-header-row">

          } else if (isSel) {

function answerS3Def(isCorrect) {
  state.s3DefAnswered = true;
  state.s3DefCorrect = isCorrect;
  if (!isCorrect) {
    showToast("Nja! Källkritisk betyder att bedöma tillförlitligheten – inte att säga emot allt.");
  }
  render();
}

function toggleS3Reason(id) {
  state.s3ReasonsChecked = false;
  const idx = state.s3ReasonsSelected.indexOf(id);
  if (idx > -1) {
    state.s3ReasonsSelected.splice(idx, 1);
  } else {
    if (state.s3ReasonsSelected.length >= 2) {
      showToast("Du kan max välja 2 skäl åt gången. Avmarkera ett först om du vill byta.");
      return;
    }
    state.s3ReasonsSelected.push(id);
  }
  render();
}

function checkS3Reasons() {
  if (state.s3ReasonsSelected.length !== 2) {
    showToast("Välj exakt 2 skäl innan du kontrollerar!");
    return;
  }
  const opts = state.levelMode === 'CA' ? s3ReasonOptionsCA : s3ReasonOptionsE;
  let validCount = 0;
  state.s3ReasonsSelected.forEach(id => {
    const found = opts.find(o => o.id === id);
    if (found && found.valid) validCount++;
  });
  state.s3ReasonsScore = validCount;
  state.s3ReasonsChecked = true;
  render();
}

function finishStage3() {
  if (!state.s3DefCorrect) {
    showToast("Svara rätt på Del 1 (vad källkritisk betyder) först!");
    return;
  }
  if (state.s3ReasonsScore < 2) {
    showToast("Välj två korrekta skäl i Del 2 och klicka på 'Kontrollera mina 2 val'!");
    return;
  }
  const c1 = document.getElementById('chkPair2A').checked;
  const c2 = document.getElementById('chkPair2B').checked;
  if (!c1 || !c2) {
    showToast("Kryssa i båda kompis-checkarna när ni har pratat igenom nyckelorden högt!");
    return;
  }
  const txt = document.getElementById('txtPair2').value.trim();
  if (txt.length < 15) {
    showToast("Skriv ner era två skäl i textrutan!");
    return;
  }
  state.pair2Text = txt;
  state.pair2PeerChecks = [c1, c2];
  state.stage = 4;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 4: MEDICAL BREAKTHROUGHS & FRAUD --- */

  const cards = isCA ? s4CardsCA : s4CardsE;

  const vocabAudio = "Nyckelord i Etapp 4: Sterilteknik är rengöring av händer och instrument för att stoppa bakterier. Forskningsfusk är att plagiera andras texter eller medvetet förfalska eller undanhålla forskningsresultat.";

    activeHtml = `
      <div class="active-question-box">
        <div class="card-header-row">
          <div>
            <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">Kort ${state.s4Index + 1} av ${cards.length} • ${escapeHtml(c.category)}</span>

      </div>

  } else {
    activeHtml = `
      <div class="feedback-box show ok">
        <strong>🎉 Grymt jobbat!</strong> Alla 4 frågor i Etapp 4 är klara. Nu är det dags för det muntliga genrepet!
      </div>
      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 3; window.scrollTo({top:0, behavior:'smooth'}); render();">← Tillbaka</button>
        <button type="button" class="btn-primary" onclick="state.stage = 5; state.s5Index = 0; state.s5Revealed = false; state.s5OralChecks = [false, false]; state.s5TimerVal = 45; window.scrollTo({top:0, behavior:'smooth'}); render();">
          Till Etapp 5: Muntligt genrep →
        </button>
      </div>
    `;

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">${isCA ? '🟣 C/A-nivå' : '🟢 E-nivå'} • Etapp 4 av 5</span>
          <h2>Medicinska genombrott & Forskningsfusk</h2>
        </div>
        <span style="font-weight: 700; color: var(--text-muted);">${state.s4History.length} / ${cards.length} klara</span>

            ${ttsButton(vocabAudio, "Lyssna")}

          <ul>
            <li><strong>Sterilteknik:</strong> Rengöring av händer, sår och verktyg för att stoppa bakterier vid operationer.</li>
            <li><strong>Forskningsfusk:</strong> Att plagiera (kopiera) andras texter, eller att medvetet förfalska eller gömma forskningsresultat.</li>
          </ul>

      ` : ''}

      ${historyHtml}
      ${activeHtml}

}

function answerS4(idx) {
  if (cooldownSeconds > 0) return;
  const cards = state.levelMode === 'CA' ? s4CardsCA : s4CardsE;
  const c = cards[state.s4Index];
  const chosen = c.options[idx];
  if (!chosen.correct) {
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs alternativen noga och försök igen.");
    return;
  }

  state.s4Score++;
  state.s4History.push({
    prompt: c.prompt,
    chosenText: chosen.text,
    explanation: c.explanation
  });
  state.s4Index++;
  render();
  if (autoTts) speakText("Rätt! " + c.explanation);
}

/* --- STAGE 5: ORAL REHEARSAL --- */
function renderStage5() {
  const isCA = state.levelMode === 'CA';
  const qList = isCA ? s5QuestionsCA : s5QuestionsE;
  const item = qList[state.s5Index];
  const fullQAudio = item.sub ? `${item.q} ${item.sub}` : item.q;
  const checkText = item.checklist.join(' ');

  return `

        <button type="button" class="btn-secondary" onclick="startOralTimer()">▶️ Starta 45 sek timer</button>
        <button type="button" class="btn-secondary" onclick="state.s5ShowNotes = !state.s5ShowNotes; render();">
          ${state.s5ShowNotes ? '▲ Dölj våra tidigare svar' : '📖 Titta på våra tidigare svar'}
        </button>
      </div>

      ${state.s5ShowNotes ? `
        <div class="vocab-box" style="margin-bottom: 16px;">

            </label>
          `).join('')}

      ` : `<p style="color: var(--text-muted); font-size: 0.96rem;">Svara högt för varandra <strong>innan</strong> ni klickar på facit!</p>`}

      ${!state.s5Revealed ? `
        <button type="button" class="btn-primary" style="margin-top: 8px;" onclick="revealOral()">
          👀 Visa facit & checklista
        </button>
      ` : `
        <div class="feedback-box show ok">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">

              <strong>✅ Det här ska finnas med i ert muntliga svar:</strong>
              <ul style="margin: 8px 0 0 0;">

        <p style="margin-top: 18px; font-weight: 700;">Hur gick ert muntliga svar?</p>
        <div class="options-grid two-col">
          <button type="button" class="option-btn" onclick="rateOral('green')">

          </button>
        </div>
      `}
    </div>
  `;
}

function toggleS5OralCheck(idx, checked) {
  state.s5OralChecks[idx] = checked;
}

function startOralTimer() {
  clearInterval(oralInterval);
  state.s5TimerVal = 45;
  state.s5TimerRunning = true;
  const disp = document.getElementById('oralTimerDisplay');
  if (disp) disp.textContent = state.s5TimerVal;

  oralInterval = setInterval(() => {
    state.s5TimerVal--;
    const d = document.getElementById('oralTimerDisplay');
    if (d) d.textContent = Math.max(0, state.s5TimerVal);
    if (state.s5TimerVal <= 0) {
      clearInterval(oralInterval);
      state.s5TimerRunning = false;
      showToast("⏱️ Tiden är ute! Dags att kolla facit.");
    }
  }, 1000);
}

function revealOral() {
  if (state.levelMode === 'E') {
    if (!state.s5OralChecks[0] || !state.s5OralChecks[1]) {
      showToast("Svara högt först och kryssa i båda nyckelorden innan ni öppnar facit!");
      return;
    }
  }
  clearInterval(oralInterval);
  state.s5Revealed = true;
  render();
}

function rateOral(rating) {
  const qList = state.levelMode === 'CA' ? s5QuestionsCA : s5QuestionsE;
  state.s5Ratings[state.s5Index] = rating;
  if (state.s5Index < qList.length - 1) {
    state.s5Index++;
    state.s5Revealed = false;
    state.s5OralChecks = [false, false];
    state.s5TimerVal = 45;
    render();
  } else {
    state.stage = 6;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }
}

          </button>
        </div>

        <div style="margin-top: 18px;">
          <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med egna ord</div>
          <label for="txtCa">C/A-utmaning: Förklara varför det är så viktigt att andra forskare kan <em>upprepa</em> ett experiment (koppla gärna till forskningsfusk):</label>
          <textarea id="txtCa" class="no-paste" rows="3" placeholder="Om andra forskare upprepar experimentet kan man se om...">${escapeHtml(state.caText)}</textarea>
        </div>
      </div>

      <div class="nav-footer">
        ${!isCA ? `
          <button type="button" class="btn-secondary" onclick="skipBonus()">
            Hoppa över bonus → Gå till sammanfattning
          </button>
        ` : `
          <button type="button" class="btn-secondary" onclick="state.stage = 5; window.scrollTo({top:0, behavior:'smooth'}); render();">
            ← Tillbaka till muntliga genrepet
          </button>
        `}
        <button type="button" class="btn-primary" onclick="finishBonus()">
          Spara & gå till sammanfattning →
        </button>
      </div>
    </div>
  `;
}

function answerCaChoice(isOk) {
  state.caChoiceAnswered = true;
  state.caChoiceCorrect = isOk;
  if (!isOk) {
    showToast("Tänk på C/A-kravet: ge två tydliga motiveringar (ekonomiskt intresse + avsaknad av kollegial granskning/upprepning).");
  }
  render();
}

function skipBonus() {
  state.didBonus = false;
  state.stage = 7;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function finishBonus() {
  const txt = document.getElementById('txtCa').value.trim();
  if (!state.caChoiceCorrect && txt.length < 10) {
    showToast(
      state.levelMode === 'CA'
        ? "Svara rätt på flervalsfrågan och skriv en kort motivering i rutan!"
        : "Svara på flervalsfrågan eller skriv ett kort svar i rutan – eller välj 'Hoppa över bonus'."
    );
    return;
  }
  state.caText = txt;
  state.didBonus = true;
  state.stage = 7;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 7: FINAL SUMMARY & GOOGLE CLASSROOM COPY --- */
function buildSummaryReport() {
  const isCA = state.levelMode === 'CA';
  const mins = Math.max(1, Math.round((Date.now() - state.startTime) / 60000));
  const nowStr = new Date().toLocaleDateString('sv-SE');
  const q1Len = isCA ? s1QuestionsCA.length : s1StepsE.length;
  const s2Len = isCA ? s2ItemsCA.length : s2ItemsE.length;
  const s4Len = isCA ? s4CardsCA.length : s4CardsE.length;
  const s5Len = isCA ? s5QuestionsCA.length : s5QuestionsE.length;
  const greenCount = state.s5Ratings.filter(r => r === 'green').length;

  let lines = [
    "==================================================",
    "SAMMANFATTNING: LEKTION 1 – VETENSKAPSDETEKTIVEN",
    "Kurs: Naturkunskap 1a1 (Bygg- och anläggningsprogrammet)",
    "==================================================",
    `Datum: ${nowStr}`,
    `Elever: ${state.student1} & ${state.student2}`,
    state.classGroup ? `Klass/Grupp: ${state.classGroup}` : null,
    `Vald nivå i appen: ${isCA ? 'C/A-nivå' : 'E-nivå'}`,
    `Arbetstid i appen: ca ${mins} min`,
    "",
    "--- RESULTAT ÖVERSIKT ---",
    `• Etapp 1 (Hypotes & Experiment): ${state.s1Score} / ${q1Len} rätt`,
    `• Etapp 2 (Naturvetenskap vs. Pseudovetenskap): ${state.s2Score} / ${s2Len} rätt`,
    `• Etapp 3 (Källkritik): Definition ${state.s3DefCorrect ? 'Rätt' : 'Ej klar'} | Två skäl: ${state.s3ReasonsScore} / 2 rätt`,
    `• Etapp 4 (Medicinska upptäckter & Forskningsfusk): ${state.s4Score} / ${s4Len} rätt`,
    `• Etapp 5 (Muntligt genrep): ${greenCount} / ${s5Len} frågor sattes direkt vid muntlig övning`,
    "",
    "--- PARETS EGNA FÖRKLARINGAR ---",
    "1. Hypotes & Vetenskapligt experiment (Par-snack #1):",
    state.pair1Text || "(Ej ifyllt)",
    "",
    "2. Varför en vetenskaplig artikel väger tyngre än sociala medier/blogg (Par-snack #2):",
    state.pair2Text || "(Ej ifyllt)"
  ].filter(item => item !== null);

  if (state.didBonus) {
    lines.push(
      "",
      "--- FÖRDJUPNING (C/A-NIVÅ) ---",
      `• Flervalsanalys av vinklad företagsstudie: ${state.caChoiceCorrect ? 'Rätt' : 'Försökt'}`,
      "• Egen reflektion kring upprepbarhet & forskningsfusk:",
      state.caText || "(Ej ifyllt)"
    );
  }

  lines.push(
    "",
    "==================================================",
    "Klar för inlämning i Google Classroom!"
  );

  return lines.join("\n");
}

function renderSummary() {
  const report = buildSummaryReport();
  const doneAudio = "Grymt jobbat! Ni är klara med Lektion 1. Klicka på knappen Kopiera sammanfattning och klistra in texten i ert delade dokument i Google Classroom.";

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-e">🎉 Klar! • Redo för Google Classroom</span>
          <h1>Snyggt jobbat, ${escapeHtml(state.student1)} & ${escapeHtml(state.student2)}!</h1>
        </div>
        ${ttsButton(doneAudio, "Lyssna")}
      </div>

      <p data-autoread="${escapeHtml(doneAudio)}">
        Gör så här för att lämna in ert arbete:
      </p>
      <ol>
        <li>Klicka på knappen <strong>”📋 Kopiera sammanfattning till Google Classroom”</strong> nedan.</li>
        <li>Öppna ert delade Google Dokument i <strong>Google Classroom</strong>.</li>
        <li>Ställ markören i dokumentet och tryck <strong>Ctrl + V</strong> för att klistra in.</li>
      </ol>

      <div style="margin: 18px 0;">
        <button type="button" class="btn-primary" style="width: 100%; font-size: 1.15rem; padding: 16px;" onclick="copySummaryToClipboard()">
          📋 Kopiera sammanfattning till Google Classroom
        </button>
      </div>

      <label for="summaryOutput">Er färdiga sammanfattning (förhandsvisning):</label>
      <textarea id="summaryOutput" class="summary-textarea" readonly>${escapeHtml(report)}</textarea>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 5; window.scrollTo({top:0, behavior:'smooth'}); render();">← Tillbaka till muntliga genrepet</button>
      </div>
    </div>
  `;
}

function copySummaryToClipboard() {
  const textarea = document.getElementById('summaryOutput');
  const text = textarea.value;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopySuccess();
    }).catch(() => {
      fallbackCopy(textarea);
    });
  } else {
    fallbackCopy(textarea);
  }
}

function fallbackCopy(textarea) {
  textarea.select();
  textarea.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    showCopySuccess();
  } catch (err) {
    showToast("Markera texten i rutan och tryck Ctrl + C för att kopiera.");
  }
}

function showCopySuccess() {
  showToast("✅ Kopierat! Gå till Google Classroom och tryck Ctrl + V i ert dokument.", true);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Initial boot
render();
setTimeout(loadSwedishVoices, 300);
</script>
</body>
